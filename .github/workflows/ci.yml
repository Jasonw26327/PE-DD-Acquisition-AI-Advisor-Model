name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest openpyxl

      - name: Verify corpus determinism
        run: |
          python src/corpus_builder.py --n 60 --pairs 12 --adversarial 100 --out-prefix data/corpus --no-xlsx
          echo "corpus.sha256=$(sha256sum data/corpus.jsonl | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Run corpus tests
        run: pytest tests/test_corpus.py -v

      - name: Verify corpus schema version
        run: |
          head -1 data/corpus.jsonl | python -c "import json,sys; r=json.load(sys.stdin); assert r['schema_version']=='pea-3.0'; print('schema OK')"

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt openpyxl

      - name: Build corpus
        run: python src/corpus_builder.py --n 120 --pairs 20 --out-prefix data/corpus --no-xlsx

      - name: Run teacher smoke test (10 steps)
        run: |
          python src/testbed.py --stage teacher --teacher-steps 10 --seed 20260806
